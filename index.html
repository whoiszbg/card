<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Card Carousel</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    overflow: hidden;
    background: #ffdcb4;
}

/* =========================
   CAROUSEL
========================= */

.carousel {
    position: relative;
    width: 100%;
    height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;
}


/* =========================
   CARD OUTER
   Handles carousel movement
========================= */

.card {
    position: absolute;

    width: min(360px, 70vw);
    aspect-ratio: 2 / 3;

    cursor: pointer;

    transition:
        transform 0.6s cubic-bezier(.22, .61, .36, 1),
        opacity 0.6s ease,
        filter 0.6s ease;

    z-index: 5;

    /* IMPORTANT */
    perspective: 2000px;
}


/* =========================
   CARD INNER
   Handles ONLY the flip
========================= */

.card-inner {
    position: relative;

    width: 100%;
    height: 100%;

    transform-style: preserve-3d;

    transition:
        transform 0.75s cubic-bezier(.4, .2, .2, 1);

    will-change: transform;
}


/* Flip */

.card.flipped .card-inner {
    transform: rotateY(180deg);
}


/* =========================
   CARD FACES
========================= */

.card-face {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    border-radius: 30px;

    overflow: hidden;

    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;

    transform-style: preserve-3d;

    box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.18);
}


/* Images */

.card-face img {
    display: block;

    width: 100%;
    height: 100%;

    object-fit: cover;

    user-select: none;
    -webkit-user-drag: none;
}


/* Back */

.card-back {
    transform: rotateY(180deg);
}


/* =========================
   CENTER CARD
========================= */

.card.center {
    transform: translateX(0) scale(1);

    opacity: 1;

    filter: blur(0);

    z-index: 10;
}


/* =========================
   LEFT CARD
========================= */

.card.left {
    transform: translateX(-420px) scale(.82);

    opacity: .6;

    filter: blur(5px);

    z-index: 5;
}


/* =========================
   RIGHT CARD
========================= */

.card.right {
    transform: translateX(420px) scale(.82);

    opacity: .6;

    filter: blur(5px);

    z-index: 5;
}


/* =========================
   HIDDEN CARDS
========================= */

.card.hidden-left {
    transform: translateX(-750px) scale(.7);

    opacity: 0;

    filter: blur(10px);

    z-index: 1;
}

.card.hidden-right {
    transform: translateX(750px) scale(.7);

    opacity: 0;

    filter: blur(10px);

    z-index: 1;
}


/* =========================
   ARROWS
========================= */

.arrow {
    position: absolute;

    top: 50%;

    width: 58px;
    height: 58px;

    border: none;
    border-radius: 50%;

    background: transparent;

    color: #776363;

    font-size: 30px;

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;

    z-index: 30;

    box-shadow:
        0 8px 25px rgba(0,0,0,.15);

    transition:
        transform .2s ease,
        background .2s ease;
}

.arrow-left {
    left: 25px;
    transform: translateY(-50%);
}

.arrow-right {
    right: 25px;
    transform: translateY(-50%);
}

.arrow:hover {
    background: white;
}

.arrow-left:hover {
    transform: translateY(-50%) scale(1.08);
}

.arrow-right:hover {
    transform: translateY(-50%) scale(1.08);
}


/* =========================
   COUNTER
========================= */

.counter {
    position: absolute;

    bottom: 30px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 30;

    background: rgba(255,255,255,.75);

    padding: 8px 18px;

    border-radius: 30px;

    font-size: 13px;

    color: #444;

    backdrop-filter: blur(10px);
}


/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    .card {
        width: min(320px, 72vw);
    }

    .card.left {
        transform: translateX(-280px) scale(.78);
    }

    .card.right {
        transform: translateX(280px) scale(.78);
    }

    .arrow {
        width: 48px;
        height: 48px;

        font-size: 24px;
    }

    .arrow-left {
        left: 10px;
    }

    .arrow-right {
        right: 10px;
    }
}

</style>
</head>


<body>

<div class="carousel">


    <!-- LEFT ARROW -->

    <button
        id="prevBtn"
        class="arrow arrow-left">
        &#10094;
    </button>


    <!-- =========================
         CARD 1
    ========================= -->

    <div class="card" data-index="0">

        <div class="card-inner">

            <div class="card-face">

                <img
                    src="2.png"
                    alt="Card 1 Front">

            </div>

            <div class="card-face card-back">

                <img
                    src="letter.png"
                    alt="Card 1 Back">

            </div>

        </div>

    </div>


    <!-- =========================
         CARD 2
    ========================= -->

    <div class="card" data-index="1">

        <div class="card-inner">

            <div class="card-face">

                <img
                    src="02DRAWING.png"
                    alt="Card 2 Front">

            </div>

            <div class="card-face card-back">

                <img
                    src="02LETTER.png"
                    alt="Card 2 Back">

            </div>

        </div>

    </div>


    <!-- =========================
         CARD 3
    ========================= -->
    <!--
    <div class="card" data-index="2">

        <div class="card-inner">

            <div class="card-face">

                <img
                    src="3.png"
                    alt="Card 3 Front">

            </div>

            <div class="card-face card-back">

                <img
                    src="letter2.png"
                    alt="Card 3 Back">

            </div>

        </div>

    </div>
    -->


    <!-- RIGHT ARROW -->

    <button
        id="nextBtn"
        class="arrow arrow-right">
        &#10095;
    </button>


    <!-- COUNTER -->
    <!--
    <div
        id="counter"
        class="counter">
        1 / 3
    </div>
    -->

</div>


<script>

const cards = document.querySelectorAll(".card");

const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const counter = document.getElementById("counter");

let current = 0;


/* =========================
   UPDATE CAROUSEL
========================= */

function updateCards() {

    cards.forEach((card, index) => {

        card.classList.remove(
            "center",
            "left",
            "right",
            "hidden-left",
            "hidden-right"
        );

        /*
         * IMPORTANT:
         * Every time we move to another card,
         * reset the new card to its front.
         */

        card.classList.remove("flipped");


        let position =
            (index - current + cards.length)
            % cards.length;


        /* CENTER */

        if (position === 0) {

            card.classList.add("center");

        }


        /* RIGHT */

        else if (position === 1) {

            card.classList.add("right");

        }


        /* LEFT */

        else if (position === cards.length - 1) {

            card.classList.add("left");

        }


        /* HIDDEN RIGHT */

        else if (position < cards.length / 2) {

            card.classList.add("hidden-right");

        }


        /* HIDDEN LEFT */

        else {

            card.classList.add("hidden-left");

        }

    });


    counter.textContent =
        `${current + 1} / ${cards.length}`;
}


/* =========================
   NEXT CARD
========================= */

function nextCard() {

    current++;

    if (current >= cards.length) {
        current = 0;
    }

    updateCards();
}


/* =========================
   PREVIOUS CARD
========================= */

function previousCard() {

    current--;

    if (current < 0) {
        current = cards.length - 1;
    }

    updateCards();
}


/* =========================
   CLICK CARD
========================= */

cards.forEach((card, index) => {

    card.addEventListener("click", function(event) {

        /*
         * CENTER CARD
         * Click = flip
         */

        if (index === current) {

            card.classList.toggle("flipped");

            return;
        }


        /*
         * SIDE CARD
         * Click = bring to center
         */

        current = index;

        updateCards();

    });

});


/* =========================
   ARROWS
========================= */

nextBtn.addEventListener("click", function(event) {

    event.stopPropagation();

    nextCard();

});


prevBtn.addEventListener("click", function(event) {

    event.stopPropagation();

    previousCard();

});


/* =========================
   KEYBOARD
========================= */

document.addEventListener("keydown", function(event) {

    if (event.key === "ArrowRight") {

        event.preventDefault();

        nextCard();

    }


    else if (event.key === "ArrowLeft") {

        event.preventDefault();

        previousCard();

    }


    else if (
        event.key === " " ||
        event.key === "Enter"
    ) {

        event.preventDefault();

        cards[current].classList.toggle("flipped");

    }

});


/* =========================
   INITIAL STATE
========================= */

updateCards();

</script>

</body>
</html>
