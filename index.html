<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flip Card</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body{
    perspective:1200px;
}

.flip-card{
    perspective:1200px;
}

.flip-inner{
    position:relative;
    width:100%;
    height:100%;
    transition:transform .7s;
    transform-style:preserve-3d;
}

.flip-card.flipped .flip-inner{
    transform:rotateY(180deg);
}

.face{
    position:absolute;
    inset:0;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    border-radius:22px;
    overflow:hidden;
}

.back{
    transform:rotateY(180deg);
}
</style>

</head>

<body class="bg-gradient-to-br from-slate-900 via-blue-950 to-slate-900 min-h-screen flex items-center justify-center p-5">

<div class="w-full max-w-sm sm:max-w-md md:max-w-lg">

    <div id="card" class="flip-card aspect-[2/3] cursor-pointer">

        <div class="flip-inner">

            <!-- FRONT -->
            <div class="face front bg-white shadow-2xl">
                <img
                    src="2.png"
                    alt="Front"
                    class="w-full h-full object-cover">
            </div>

            <!-- BACK -->
            <div class="face back bg-white shadow-2xl">
                <img
                    src="letter.png"
                    alt="Back"
                    class="w-full h-full object-cover">
            </div>

        </div>

    </div>

</div>

<script>
const card = document.getElementById("card");

card.addEventListener("click", () => {
    card.classList.toggle("flipped");
});
</script>

</body>
</html>
