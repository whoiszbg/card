<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Square Flip Card</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    perspective:1200px;
}

.flip-card{
    perspective:1200px;
}

.flip-inner{
    position:relative;
    width:100%;
    height:100%;
    transition:transform .7s ease;
    transform-style:preserve-3d;
}

.flip-card.flipped .flip-inner{
    transform:rotateY(180deg);
}

.face{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    border-radius:24px;
    overflow:hidden;
    backface-visibility:hidden;
    box-shadow:0 20px 40px rgba(0,0,0,.35);
}

.back{
    transform:rotateY(180deg);
}
</style>

</head>

<body class="bg-gradient-to-br from-slate-900 via-blue-950 to-slate-900 min-h-screen flex items-center justify-center p-6">

<div class="w-full flex justify-center">

    <!-- Square Flip Card -->
    <div
        id="card"
        class="flip-card w-full max-w-[600px] aspect-square cursor-pointer"
    >

        <div class="flip-inner">

            <!-- FRONT -->
            <div class="face bg-white">

                <!-- Replace with your image -->
                <img
                    src="2.png"
                    alt="Front Image"
                    class="w-full h-full object-contain bg-white"
                >

            </div>

            <!-- BACK -->
            <div
                class="face back bg-gradient-to-br from-blue-700 via-blue-500 to-cyan-400 text-white flex flex-col items-center justify-center p-8"
            >

                <h2 class="text-4xl font-bold mb-5">
                    Back Side
                </h2>

                <p class="text-center text-lg leading-relaxed max-w-sm">
                    You can place any content here such as text,
                    buttons, QR codes, social media links,
                    contact information, or another image.
                </p>

            </div>

        </div>

    </div>

</div>

<script>
const card = document.getElementById("card");

card.addEventListener("click", () => {
    card.classList.toggle("flipped");
});
</script>

</body>
</html>
